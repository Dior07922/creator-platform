<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>苒境 · 3D 路径漫游模板</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#111013;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab}
  #stage.dragging{cursor:grabbing}

  /* 顶部标题 */
  .hud{position:fixed;left:0;right:0;top:0;padding:18px 22px;display:flex;justify-content:space-between;
       align-items:flex-start;pointer-events:none;z-index:10}
  .brand{font-size:15px;letter-spacing:.16em;color:#eae4d8;font-weight:600}
  .brand small{display:block;font-size:10px;letter-spacing:.22em;color:#7d7565;font-weight:400;margin-top:5px}
  .count{font-size:11px;color:#7d7565;letter-spacing:.12em}

  /* 底部控制条 */
  .bar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:10px;
       align-items:center;z-index:10;padding:8px;border-radius:999px;
       background:rgba(28,26,30,.62);backdrop-filter:blur(18px);
       box-shadow:0 8px 32px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.07) inset}
  .bar button{border:0;background:transparent;color:#b9b0a0;font:600 13px/1 inherit;
       padding:10px 15px;border-radius:999px;cursor:pointer;transition:.18s;white-space:nowrap}
  .bar button:hover{background:rgba(255,255,255,.08)}
  .bar button.on{background:#e8e2d6;color:#17161a}
  .bar .sep{width:1px;height:22px;background:rgba(255,255,255,.13);margin:0 3px}

  /* 进度条 */
  .prog{position:fixed;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.07);z-index:11}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c8a96a,#8a6f3c);transition:width .12s linear}

  .hint{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);font-size:12px;color:#7d7565;
        letter-spacing:.1em;z-index:10;pointer-events:none;transition:opacity .6s}
  .hint.fade{opacity:0}

  /* ===== 触屏适配 ===== */
  @media (pointer: coarse) {
    /* 按钮加大到手指能稳点（≥46px），并躲开 iPhone 底部横条 */
    .bar{bottom:calc(20px + env(safe-area-inset-bottom, 0px));gap:5px;padding:7px;
         max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
    .bar::-webkit-scrollbar{display:none}
    .bar button{padding:14px 16px;font-size:15px;min-height:46px}
    .bar .sep{height:26px}
    .hud{padding-top:calc(16px + env(safe-area-inset-top, 0px));padding-left:calc(18px + env(safe-area-inset-left, 0px))}
    .hint{display:none}                 /* 手机上不显示键盘/滚轮提示 */
    .prog{height:3px}
  }
  /* 窄屏手机：按钮换两行，全部露出来，不用横滑 */
  @media (pointer: coarse) and (max-width: 460px) {
    .bar{flex-wrap:wrap;justify-content:center;border-radius:24px;
         max-width:calc(100vw - 16px);overflow:visible;
         row-gap:2px;padding:7px 9px}
    .bar .sep{display:none}
    .bar button{padding:12px 15px;font-size:15px}
  }
  /* 横屏手机：底部条别挡住画面 */
  @media (pointer: coarse) and (orientation: landscape) {
    .bar{bottom:calc(10px + env(safe-area-inset-bottom, 0px))}
    .bar button{padding:9px 13px;min-height:40px;font-size:14px}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud">
  <div class="brand">苒境 · 空间漫游<small>SPATIAL ROAMING</small></div>
  <div class="count" id="count"></div>
</div>

<div class="hint" id="hint">滚轮 / 拖动 前进　·　空格自动播放</div>

<div class="bar">
  <button class="pathBtn on" data-path="0">路径 1</button>
  <button class="pathBtn" data-path="1">路径 2</button>
  <button class="pathBtn" data-path="2">路径 3</button>
  <button class="pathBtn" data-path="3">路径 4</button>
  <button class="pathBtn" data-path="4">路径 5</button>
  <div class="sep"></div>
  <button id="btnExit">退出</button>
</div>
<div class="prog"><i id="progBar"></i></div>

<script src="/roam/lib/three.min.js"></script>
<script src="/roam/lib/gsap.min.js"></script>
<script>
(function () {
  'use strict';

  // ============================================================
  //  内容卡片：全部用 canvas 现画（离线可用，不依赖任何图片文件）
  // ============================================================
/*__PHOTOS_BEGIN__*/
  const PHOTOS = [
    "/roam/img/00_30843199.jpg",
    "/roam/img/01_16470356.jpg",
    "/roam/img/02_16415242.jpg",
    "/roam/img/03_x6108929.jpg",
    "/roam/img/04_x6108947.jpg",
    "/roam/img/05_28802631.jpg",
    "/roam/img/12_x8749146.jpg",
    "/roam/img/13_14595968.jpg",
    "/roam/img/14_18155101.jpg",
    "/roam/img/15_36679416.jpg",
    "/roam/img/19_x6034155.jpg",
    "/roam/img/20_30008704.jpg",
    "/roam/img/21_31251953.jpg",
    "/roam/img/22_14524822.jpg",
    "/roam/img/p14_35083295.jpg",
    "/roam/img/p15_20729681.jpg",
    "/roam/img/p16_34256516.jpg",
    "/roam/img/p17_39228879.jpg",
    "/roam/img/p18_34391289.jpg",
    "/roam/img/p19_33288003.jpg",
    "/roam/img/p20_13834911.jpg",
    "/roam/img/p21_27742049.jpg",
    "/roam/img/p22_32702192.jpg",
    "/roam/img/p23_31840885.jpg",
    "/roam/img/p24_15088869.jpg",
    "/roam/img/p25_x8555087.jpg"
  ];
  /*__PHOTOS_END__*/

  const CARD_W = 512;                       // 画布分辨率

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // 五种配色，让空间里有层次
  const PALETTES = [
    { a: '#f6e7d3', b: '#e2c39a', ink: '#4a3a26' },
    { a: '#dfe7f2', b: '#b3c6de', ink: '#25344a' },
    { a: '#f2e2e6', b: '#dcb4bf', ink: '#4a2830' },
    { a: '#e3efe4', b: '#aecdb2', ink: '#22402a' },
    { a: '#efe8f5', b: '#c9b6de', ink: '#382a4a' },
  ];

  // 程序化"画作"：柔和的渐变 + 几何形状，远看像一幅安静的作品
  function paintArt(g, w, h, seed, pal) {
    const rnd = (n => () => (n = (n * 16807) % 2147483647) / 2147483647)(seed * 7919 + 13);
    const grad = g.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, pal.a); grad.addColorStop(1, pal.b);
    g.fillStyle = grad; g.fillRect(0, 0, w, h);

    // 柔和光斑
    for (let i = 0; i < 9; i++) {
      const cx = rnd() * w, cy = rnd() * h, r = (0.12 + rnd() * 0.42) * w;
      const rg = g.createRadialGradient(cx, cy, 0, cx, cy, r);
      const light = rnd() > .5;
      rg.addColorStop(0, light ? 'rgba(255,255,255,.55)' : 'rgba(60,50,40,.20)');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = rg; g.fillRect(0, 0, w, h);
    }
    // 几条细弧线，像笔触
    g.strokeStyle = 'rgba(255,255,255,.42)';
    for (let i = 0; i < 5; i++) {
      g.lineWidth = 1 + rnd() * 2.4;
      g.beginPath();
      const y0 = rnd() * h;
      g.moveTo(-20, y0);
      g.bezierCurveTo(w * .3, y0 - 90 + rnd() * 180, w * .7, y0 + 90 - rnd() * 180, w + 20, y0 + (rnd() - .5) * 160);
      g.stroke();
    }
    // 一两块实心形，压住画面
    g.globalAlpha = .30; g.fillStyle = pal.ink;
    for (let i = 0; i < 2; i++) {
      const cx = rnd() * w, cy = rnd() * h, r = (0.10 + rnd() * 0.20) * w;
      g.beginPath();
      if (rnd() > .5) g.arc(cx, cy, r, 0, Math.PI * 2);
      else roundRect(g, cx - r, cy - r * .7, r * 2, r * 1.4, r * .3);
      g.fill();
    }
    g.globalAlpha = 1;
  }

  const photoCache = new Map();
  const texCache = new Map();   // 卡片贴图缓存：几百张卡片复用同样的图，不重复建
  function getPhoto(uri) {
    if (!photoCache.has(uri)) {
      const im = new Image();
      im.src = uri;
      photoCache.set(uri, im);
    }
    return photoCache.get(uri);
  }

  // 真图卡片：白边 + 照片 + 底部小标签，像一张装裱好的作品
  function makeImageCard(uri) {
    const c = document.createElement('canvas');
    c.width = CARD_W; c.height = Math.round(CARD_W * 1.34);
    const g = c.getContext('2d');
    g.fillStyle = '#fdfcfa'; g.fillRect(0, 0, c.width, c.height);
    const M = 24;                                   // 白边
    const iw = c.width - M * 2, ih = c.height - M * 2;
    const im = getPhoto(uri);
    if (im.complete && im.naturalWidth) {
      // cover 裁切，不留变形
      const t = iw / ih, s = im.naturalWidth / im.naturalHeight;
      let sw, sh;
      if (s > t) { sh = im.naturalHeight; sw = sh * t; } else { sw = im.naturalWidth; sh = sw / t; }
      g.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, M, M, iw, ih);
    } else {
      // 图还没解码完：先画个占位，加载好之后会自动重画（见下面 rebuildCards）
      g.fillStyle = '#e8e2d6'; g.fillRect(M, M, iw, ih);
    }
    // 不写任何文字
    return { canvas: c, ready: im.complete && !!im.naturalWidth };
  }

  function makeTextCard(pal, title, body) {
    const c = document.createElement('canvas');
    c.width = CARD_W; c.height = Math.round(CARD_W * 1.34);
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, c.height);
    grad.addColorStop(0, pal.a); grad.addColorStop(1, pal.b);
    g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
    g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 2;
    roundRect(g, 16, 16, c.width - 32, c.height - 32, 14); g.stroke();

    g.fillStyle = pal.ink;
    g.font = '700 54px "PingFang SC","Microsoft YaHei",sans-serif';
    wrapText(g, title, 52, 150, c.width - 104, 66);
    g.globalAlpha = .72;
    g.font = '400 26px "PingFang SC","Microsoft YaHei",sans-serif';
    wrapText(g, body, 52, 150 + 66 * Math.ceil(title.length / 7) + 34, c.width - 104, 40);
    g.globalAlpha = 1;
    return c;
  }

  function wrapText(g, text, x, y, maxW, lh) {
    let line = '', yy = y;
    for (const ch of text) {
      if (g.measureText(line + ch).width > maxW) { g.fillText(line, x, yy); line = ch; yy += lh; }
      else line += ch;
    }
    if (line) g.fillText(line, x, yy);
    return yy;
  }

  // 苒境式「纸张」：竖长条，像手机屏那张纸
  function makePaperCard(pal, label) {
    const c = document.createElement('canvas');
    c.width = 380; c.height = 820;
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
    const grad = g.createLinearGradient(0, 0, 0, c.height);
    grad.addColorStop(0, pal.a); grad.addColorStop(1, pal.b);
    g.fillStyle = grad; g.fillRect(18, 18, c.width - 36, c.height - 36);
    g.fillStyle = 'rgba(255,255,255,.85)';
    roundRect(g, 42, 92, c.width - 84, 190, 12); g.fill();
    roundRect(g, 42, 310, c.width - 130, 130, 12); g.fill();
    roundRect(g, 42, 468, c.width - 84, 96, 12); g.fill();
    g.fillStyle = pal.ink; g.globalAlpha = .6;
    g.font = '600 20px "PingFang SC",sans-serif';
    g.fillText(label, 42, 60);
    g.globalAlpha = 1;
    return c;
  }

  // ============================================================
  //  三条路径（CatmullRomCurve3）
  // ============================================================

  // ===== 照 curve-gallery 源码的参数 =====
  const TOTAL     = 430;    // 配合 2 倍曲线
  const CAM_Z     = 23;     // 配合 40° 视角后退，画面里图的多少不变
  const FOCUS_DIST= 11.0;   // 聚焦距离（镜头后退了，圈要跟着放大）
  const MAX_SCALE = 12;     // 最大放大倍数（参考 14）
  const Z_GATE    = 48;     // 深度门限（配合新镜头距离）
  const LATERAL   = 2.0;    // 侧向散布 ±（参考 ±1 配 0.3 的图，比例约 3 倍图宽）
  const DEPTH_R   = 1.5;    // 深度散布 ±（参考 ±0.75 配 0.3 的图 —— 只差一点，不是炸开）
  const SIZE_LO   = 0.42, SIZE_HI = 0.78;   // 平面尺寸
  const rand = (a, b) => a + Math.random() * (b - a);

  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  // 曲线铺在 XY 平面（正对着看），Z 只做轻微起伏 —— 这样才看得见形状
  const PATHS = [
    // ① 山谷：两头高、中间沉
    { name: '路径 1 · 山谷', pts: [V(-26.0, 14.0, 0.0), V(-16.0, -1.4, 1.2), V(-5.6, -11.0, -1.2), V(5.6, -11.0, 1.2), V(16.0, -1.4, -1.2), V(26.0, 14.0, 0.0)] },
    // ② 回旋：绕一圈
    { name: '路径 2 · 回旋', pts: [V(-20.0, 6.0, 0.0), V(-9.4, 14.0, 1.2), V(2.8, 14.0, -1.2), V(12.4, 6.0, 1.2), V(12.4, -6.0, -1.2), V(2.8, -12.8, 1.2), V(-9.4, -12.8, -1.2), V(-20.0, -6.0, 0.0)] },
    // ③ 斜穿：对角直线
    { name: '路径 3 · 斜穿', pts: [V(-26.0, 15.0, 0.0), V(-15.0, 8.0, 1.2), V(-4.0, 1.4, -1.2), V(6.8, -5.6, 1.2), V(17.6, -11.0, -1.2), V(27.2, -15.0, 0.0)] },
    // ④ 大拱：一座拱桥
    { name: '路径 4 · 大拱', pts: [V(-27.2, -9.6, 0.0), V(-17.6, 4.0, 1.2), V(-8.0, 14.0, -1.2), V(4.0, 15.0, 1.2), V(15.0, 9.6, -1.2), V(23.2, -1.4, 1.2), V(28.6, -11.0, 0.0)] },
    // ⑤ 波浪：上下起伏
    { name: '路径 5 · 波浪', pts: [V(-28.6, 0.0, 0.0), V(-19.0, 11.0, 1.2), V(-9.6, -9.6, -1.2), V(0, 5.5, 1.2), V(9.6, -9.6, -1.2), V(19.0, 11.0, 1.2), V(28.6, -2.8, 0.0)] },
  ];

  // ============================================================
  //  场景
  // ============================================================
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;

  const BG = 0x111013;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 42, 200);   // 深色底把远处自然吃进去          // 雾：只把最远处融掉，近处要实

  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 900);   // 长焦：远处不会一下子缩没

  // 卡片容器
  const world = new THREE.Group();
  scene.add(world);

  // 背景浮尘：给空间一点体积感
  (function makeDust() {
    const N = 420, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      pos[i * 3] = (Math.random() - .5) * 90;
      pos[i * 3 + 1] = (Math.random() - .5) * 60;
      pos[i * 3 + 2] = -Math.random() * 230 + 20;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      color: 0xb9ad95, size: 0.42, transparent: true, opacity: .5, depthWrite: false
    })));
  })();

  // ============================================================
  //  沿路径摆卡片
  // ============================================================
  let cards = [];
  const LABELS = ['晨间手记', '第七页', '光线练习', '未寄出的信', '植物观察', '窗与影', '旧纸张', '雨的形状',
                  '夜航', '折角', '远处的人', '安静的下午', '第一次', '草稿本', '海的方向', '留白',
                  '三月的风', '练习曲'];
  const TEXTS = [
    ['空间的记忆', '纸张不再是平的，它悬在那里，等你走近。'],
    ['关于漫游', '镜头沿着你画的路径前进，内容自己退到两边。'],
    ['无限延展', '永远走不完，是这个空间最迷人的地方。'],
  ];

  function buildCards(pathIndex) {
    for (const c of cards) {
      world.remove(c.mesh);
      if (c.mesh.material.map) c.mesh.material.map.dispose();
      c.mesh.material.dispose(); c.mesh.geometry.dispose();
    }
    cards = [];

    const curve = new THREE.CatmullRomCurve3(PATHS[pathIndex].pts, true, 'catmullrom', 0.5);
    let textUsed = 0;

    for (let i = 0; i < TOTAL; i++) {
      const t = i / TOTAL;                       // 闭合曲线上均匀分布，绕回起点不留缝
      const pos = curve.getPoint(t);
      const tan = curve.getTangent(t);
      const nx = -tan.y, ny = tan.x;             // ★ 平面内的法线（源码同款：切线转 90°）

      const lateral = rand(-LATERAL, LATERAL);   // 侧向散布
      const depth = rand(-DEPTH_R, DEPTH_R);     // 深度散布
      const size = rand(SIZE_LO, SIZE_HI);

      // 只放纯图片 —— 不带任何文字卡、纸张卡
      const texCanvas = makeImageCard(PHOTOS[i % PHOTOS.length]);
      const w = size, hh = size * 1.34, kind = 'image';

      const cacheKey = 'p' + (i % PHOTOS.length);
      let tex = texCache.get(cacheKey);
      if (!tex) { tex = new THREE.CanvasTexture(texCanvas.canvas || texCanvas); texCache.set(cacheKey, tex); }
      if (tex.encoding !== undefined) tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;

      const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true, depthWrite: false });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, hh), mat);

      mesh.position.set(pos.x + nx * lateral, pos.y + ny * lateral, pos.z + depth);
      // ★ 不旋转 —— 全部同朝向（源码同款）。旋转是抖动的来源之一。

      mesh.userData = { t, lateral, depth, scaleNow: 1, targetScale: 1, kind };
      world.add(mesh);
      cards.push({ mesh, t: t, curve });
    }
    document.getElementById('count').textContent = cards.length + ' 个内容 · ' + PATHS[pathIndex].name;
  }

  // ============================================================
  //  镜头沿路径前进
  // ============================================================
  let pathIndex = 0;
  let progress = 0;                 // 0..1
  let auto = false;
  let curve = new THREE.CatmullRomCurve3(PATHS[0].pts, true, 'catmullrom', 0.5);
  const lookAt = new THREE.Vector3();
  const camPos = new THREE.Vector3();

  function setPath(i) {
    pathIndex = i;
    buildCards(i);
    curve = new THREE.CatmullRomCurve3(PATHS[i].pts, true, 'catmullrom', 0.5);
    document.querySelectorAll('.pathBtn').forEach(b => b.classList.toggle('on', Number(b.dataset.path) === i));
    document.getElementById('count').textContent = cards.length + ' 个内容 · ' + PATHS[i].name;
  }

  const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();

  function updateCamera() {
    const t = ((progress % 1) + 1) % 1;   // 闭合曲线
    curve.getPoint(t, camPos);
    // ★ 相机沿 Z 偏出曲线，且朝向固定（不 lookAt）—— 源码同款，这是不抖的关键
    camera.position.set(camPos.x, camPos.y, camPos.z + CAM_Z);
    camera.rotation.set(0, 0, 0);   // 照参考：正对。空间感靠的是图上的深度差，不是歪镜头
  }

  // 靠近镜头的卡片放大一点，成为焦点
  function updateCards() {
    const t = ((progress % 1) + 1) % 1;   // 闭合曲线
    const focusTGate = (FOCUS_DIST * 1.5) / Math.max(1, curve.getLength());
    for (const c of cards) {
      const m = c.mesh, u = m.userData;
      const dx = camera.position.x - m.position.x;
      const dy = camera.position.y - m.position.y;
      const dz = Math.abs(camera.position.z - m.position.z);
      const distXY = Math.sqrt(dx * dx + dy * dy);

      let dt = Math.abs(u.t - t);
      const inZone = dt < focusTGate && dz < Z_GATE && distXY < FOCUS_DIST;
      const target = inZone ? (1 + Math.pow(1 - distXY / FOCUS_DIST, 3) * (MAX_SCALE - 1)) : 1;

      // 平滑逼近，不做逐帧突变
      u.scaleNow += (target - u.scaleNow) * 0.22;
      m.scale.setScalar(u.scaleNow);
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;

    if (auto && !dragging) {
      // 走过的段落慢一点，留出"焦点停留"的余地
      const speed = 0.026 * (0.55 + 0.45 * Math.abs(Math.sin(progress * Math.PI)));
      progress += speed * dt;
      if (progress >= 1) progress -= 1;        // 闭合曲线：绕回起点，无缝接上
    }
    updateCamera();
    updateCards();
    document.getElementById('progBar').style.width = (progress * 100).toFixed(2) + '%';
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  // ============================================================
  //  交互：滚轮 / 拖动 / 自动播放 / 路径切换
  // ============================================================
  let dragging = false, dragX = 0, dragY = 0;
  const FOV0 = 52;
  const pointers = new Map();            // 同时按住的手指：id → {x,y}
  let pinchStart = 0, pinchFov = FOV0, pinchCy = 0, pinchCx = 0;

  const hint = document.getElementById('hint');
  const fadeHint = () => { if (!hint.classList.contains('fade')) hint.classList.add('fade'); };

  // 桌面：滚轮
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); fadeHint();
    progress += (e.deltaY > 0 ? 1 : -1) * 0.0092;
    progress = ((progress % 1) + 1) % 1;   // 闭合曲线：绕圈，不封顶
  }, { passive: false });

  canvas.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    fadeHint();

    if (pointers.size === 1) {
      dragging = true; dragX = e.clientX; dragY = e.clientY;
      canvas.classList.add('dragging');
    } else if (pointers.size === 2) {
      // ★ 第二根手指一落：立刻停止前进，转成捏合缩放视野
      dragging = false; canvas.classList.remove('dragging');
      const [a, b] = [...pointers.values()];
      pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
      pinchCx = (a.x + b.x) / 2; pinchCy = (a.y + b.y) / 2;
      pinchFov = camera.fov;
    }
  });

  canvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    // 两指：只缩放视野，绝不推进镜头
    if (pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchStart > 8) {
        camera.fov = Math.max(20, Math.min(80, pinchFov * (pinchStart / Math.max(8, d))));
        camera.updateProjectionMatrix();
      }
      return;
    }

    if (!dragging) return;
    const dx = e.clientX - dragX, dy = e.clientY - dragY;
    dragX = e.clientX; dragY = e.clientY;
    progress += (-dx + dy) * 0.00046;
    progress = ((progress % 1) + 1) % 1;   // 闭合曲线：绕圈，不封顶
  });

  const endDrag = e => {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      dragging = false; canvas.classList.remove('dragging'); pinchStart = 0;
      restoreFov();                                  // 松手后视野缓缓回到标准
    } else if (pointers.size === 1) {
      const [a] = [...pointers.values()];            // 回到单指：重置锚点，避免跳一下
      dragX = a.x; dragY = a.y; dragging = true; pinchStart = 0;
    }
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // 捏合松手后，视野平滑回正（不让用户被卡在奇怪的焦距里）
  function restoreFov() {
    if (Math.abs(camera.fov - FOV0) < 0.5) return;
    gsap.to(camera, {
      fov: FOV0, duration: .55, ease: 'power2.out',
      onUpdate: () => camera.updateProjectionMatrix()
    });
  }

    
  // （「回到起点」按钮已移除）

  document.querySelectorAll('.pathBtn').forEach(b => {
    b.onclick = () => {
      const i = Number(b.dataset.path);
      // 切路径时镜头平滑淡出再进（不硬切）
      gsap.to({ o: 1 }, {
        o: 0, duration: .42, ease: 'power2.in',
        onUpdate: function () { world.visible = this.targets()[0].o > .5; },
        onComplete: () => { setPath(i); progress = 0; gsap.to({ o: 0 }, { o: 1, duration: .5, ease: 'power2.out', onUpdate: function () { world.visible = true; } }); }
      });
    };
  });

  window.addEventListener('keydown', e => {
        if (e.code === 'ArrowRight') progress = Math.min(1, progress + 0.02);
    if (e.code === 'ArrowLeft') progress = Math.max(0, progress - 0.02);
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ============================================================
  //  启动
  // ============================================================
  // 真图是内嵌的 data URI，解码要时间 —— 必须等全部解码完再建卡片，否则会画成占位块
  Promise.all(PHOTOS.map(u => new Promise(res => {
    const im = new Image();
    im.onload = im.onerror = () => { photoCache.set(u, im); res(); };
    im.src = u;
  }))).then(() => {
    setPath(0);
    camera.position.copy(curve.getPoint(0));
    lookAt.copy(curve.getPoint(0.03));
    loop(performance.now());
  });

  // 暴露给自动化测试
  window.__roam = {
    get progress() { return progress; },
    set progress(v) { progress = Math.max(0, Math.min(1, v)); },
    get pathIndex() { return pathIndex; },
    get cardCount() { return cards.length; },
    get auto() { return auto; },
    cameraPos: () => camera.position.toArray().map(v => +v.toFixed(3)),
    fov: () => +camera.fov.toFixed(2),
    pointers: () => pointers.size,
    cardScales: () => cards.map(c => +(c.mesh.userData.scaleNow ?? 1).toFixed(3)),
    cardKinds: () => cards.map(c => c.mesh.userData.kind),
  };

document.getElementById('btnExit').onclick = () => {
  // 从演示退回去：有上一页就回上一页，否则回苒境主站
  if (history.length > 1 && document.referrer) history.back();
  else location.href = 'https://helloranjing.com';
};
})();
</script>
</body>
</html>
