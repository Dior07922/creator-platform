name: CI Smoke Test

on:
  push:
    branches: [ main ]

jobs:
  runner-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Verify environment
        shell: powershell
        run: |
          Write-Host "Runner is working"
          & "C:\Program Files\nodejs\node.exe" -v
          & "C:\Program Files\Git\bin\git.exe" --version
          & "C:\Users\10427\.android\platform-tools\adb.exe" version