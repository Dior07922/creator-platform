name: CI Build APK Local

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-local:
    runs-on: self-hosted
    env:
      JAVA_HOME: C:\Users\10427\jdk-21.0.2
      ANDROID_HOME: C:\Users\10427\.android
      PROJECT_DIR: C:\Users\10427\Desktop\苒境_当前最新工程_20260905
    steps:
      - name: Build web (static export)
        shell: powershell
        run: |
          cd $env:PROJECT_DIR
          $env:NEXT_PUBLIC_EXPORT = "true"
          if (Test-Path app\api) { Move-Item -Path app\api -Destination api_backup -Force }
          npm run build
          if (Test-Path api_backup) { Move-Item -Path api_backup -Destination app\api -Force }
      - name: Sync Capacitor
        shell: powershell
        run: |
          cd $env:PROJECT_DIR
          npx cap sync android
      - name: Build Android APK
        shell: powershell
        run: |
          cd $env:PROJECT_DIR\android
          .\gradlew.bat assembleDebug
      - name: Install APK to device
        shell: powershell
        run: |
          adb install -r $env:PROJECT_DIR\android\app\build\outputs\apk\debug\app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk